[build-system]
requires      = [ "setuptools>=62.3" ]
build-backend = "setuptools.build_meta"

[project]
name = "deepecohab"
version = "0.6.0"
description = "EcoHab with some machine learning"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
    { name = "Konrad Danielewski", email = "k.danielewski@nencki.edu.pl" },
    { name = "Ula Włodkowska", email = "u.wlodkowska@nencki.edu.pl" },
]
keywords = [
    "neuroscience",
    "ecology",
    "dash",
    "data-visualization",
    "data-analysis",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "kaleido",
    "networkx",
    "numpy",
    "openskill",
    "plotly",
    "polars",
    "pydantic",
    "scipy",
    "tqdm",
    "tzdata; sys_platform == 'win32'",
]

    [project.optional-dependencies]
    app = [
        "dash[diskcache]>=4",
        "dash-mantine-components>=2.8.0",
        "packaging",
        "pyshortcuts",
    ]

    notebook = [
        "ipykernel",
        "ipywidgets",
        "nbformat",
    ]

    test = [
        "pytest",
        "hypothesis",
    ]

    docs = [
        "jupyter-book<2",
    ]

    dev = [
        "deepecohab[app,notebook,test]",
        "ruff>=0.15.17",
        "ty>=0.0.50",
        "pre-commit",
    ]

    [project.scripts]
    deepecohab-app = "deepecohab.app.__main__:main"
    deepecohab-shortcut = "deepecohab.app.shortcut:main"

    [project.urls]
    Homepage = "https://github.com/KonradDanielewski/DeepEcoHab"
    Issues   = "https://github.com/KonradDanielewski/DeepEcoHab/issues"

[tool.setuptools]
include-package-data = true

    [tool.setuptools.packages.find]
    where      = [ "." ]
    include    = [ "deepecohab*" ]
    namespaces = true

    [tool.setuptools.package-data]
    "deepecohab.app" = ["assets/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

    [tool.ruff.format]
    quote-style  = "double"
    indent-style = "tab"

    docstring-code-format = true

    [tool.ruff.lint]
    extend-select = [
        "UP",   # pyupgrade
        "D",    # pydocstyle
        "I",    # isort — own import ordering
        "B",    # bugbear — mutable defaults, zip strict, etc.
        "RUF",  # ruff-specific — implicit Optional, etc.
        "SIM",  # flake8-simplify
        "C4",   # comprehensions
        "NPY",  # numpy-specific lints
        "E",  # pycodestyle errors
        "F",  # pyflakes
    ]

    ignore = [
        "D206",  # docstring tab indentation — conflicts with indent-style = "tab"
        "D100",  # missing module docstring — ceremonial
        "D104",  # missing package docstring — __init__.py re-exports
        "D105",  # missing magic-method docstring — dunders are self-explanatory
        "D107",  # missing __init__ docstring — args documented at class level
        "D417",  # missing param description — noise from **kwargs registry passthrough
    ]

    [tool.ruff.lint.per-file-ignores]
    "tests/**" = ["D"]   # no docstring rules in tests

    [tool.ruff.lint.pydocstyle]
    convention = "google"

    [tool.ruff.lint.isort]
    combine-as-imports = true

[tool.ty.src]
# Type-check shipping source only; tests intentionally exercise odd types.
include = ["deepecohab"]

[tool.pytest.ini_options]
testpaths = [ "tests" ]
# ``import strategies`` resolves by configuration, not by pytest's rootdir insertion.
pythonpath = [ "tests" ]
addopts   = "-ra"
markers   = [
    "e2e: full end-to-end pipeline test on the bundled field example data (slow).",
]
