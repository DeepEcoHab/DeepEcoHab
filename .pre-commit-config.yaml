repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uv run --extra dev ty check
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: todo-owner-issue
        name: TODO/FIXME/XXX/HACK/BUG need (owner) and an issue
        language: pygrep
        entry: '(#|//|\*)\s*(TODO|FIXME|XXX|HACK|BUG)\b(?!\([\w-]+\): .*(#|issues/)\d+)'
        types_or: [python, javascript, css]
